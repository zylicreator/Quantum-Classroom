name: Bug report / 问题反馈
description: Report a reproducible interface, calculation, or explanation problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the classroom tool. You may write in English or Chinese.
        Please use synthetic examples and avoid attaching identifiable student records.
  - type: dropdown
    id: area
    attributes:
      label: Laboratory or area / 实验室或功能
      options:
        - Atomic orbitals / 原子轨道
        - Molecular orbitals · H₂⁺ / 分子轨道
        - Classroom activities or records / 课堂任务或记录
        - Language, layout, or accessibility / 语言、布局或无障碍
        - Build or tests / 构建或验证
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system / 浏览器和系统
      placeholder: "For example: Firefox on Windows; interface language: English"
    validations:
      required: true
  - type: textarea
    id: parameters
    attributes:
      label: Model and parameters / 模型与参数
      description: Include the orbital, nuclear distance or observation radius, measurement count, and seed if relevant.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
      description: For a scientific correction, include the reference or calculation supporting it.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: A screenshot or a short error message may help.
    validations:
      required: true
