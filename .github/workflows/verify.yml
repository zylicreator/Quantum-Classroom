name: Verify classroom models and interface

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.txt
          npx playwright install --with-deps chromium
      - name: Check reproducible offline build
        run: python assets/build.py --check
      - name: Verify JavaScript probability models
        run: npm test
      - name: Independently verify atomic and molecular models
        run: |
          python assets/verify_independent.py
          python assets/verify_molecular_independent.py
      - name: Exercise both bilingual classroom interfaces
        run: npm run test:browser
      - name: Package offline distribution
        run: python scripts/package_release.py
      - name: Save test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-browser-checks
          path: artifacts/
          if-no-files-found: ignore
      - name: Save offline package
        uses: actions/upload-artifact@v4
        with:
          name: electron-cloud-classroom-offline
          path: dist/*.zip
